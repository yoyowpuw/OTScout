# Vendor alias table.
#
# ICS advisories and device banners spell the same company many different ways.
# This table maps every spelling we have seen onto one canonical id, so that a
# device reporting "Siemens AG" and an advisory saying "Siemens" resolve to the
# same vendor.
#
# Adding a vendor or an alias is the easiest useful contribution to this project.
# Rules:
#   id              lowercase, hyphenated, stable. Never rename an existing id.
#   display         the name as the vendor writes it, shown in the UI.
#   aliases         lowercased spellings seen in advisories or on the wire. Do
#                   not repeat the display name, it is matched automatically.
#   version_scheme  which firmware comparator to use, see version.go. Omit for
#                   the generic comparator.
#   catalog_parsers order code parsers to try, see catalog.go.
#
# Companies that were split or acquired keep separate ids when they publish
# separate advisories. Siemens and Siemens Energy are two entries on purpose:
# collapsing them would attach one company's advisories to the other's devices.

version: 1

vendors:
  - id: siemens
    display: Siemens
    aliases:
      - siemens ag
      - siemens industry
      - siemens industry inc
      - siemens healthineers
      - siemens mobility
    version_scheme: siemens
    catalog_parsers: [siemens-mlfb]

  - id: siemens-energy
    display: Siemens Energy
