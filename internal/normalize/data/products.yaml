# Product family table.
#
# Advisories name a product family, while a device on the wire usually reports a
# model. An advisory says "SIMATIC S7-1200 CPU family" and the PLC says
# "CPU 1214C". This table connects the two so the matcher can see that they are
# the same thing.
#
# Fields:
#   id       lowercase, hyphenated, stable. Never rename an existing id.
#   vendor   canonical vendor id from vendors.yaml.
#   display  the family name as the vendor writes it.
#   aliases  other spellings of the family, lowercased. Matching is token based,
#            so "s7 1200" also covers "S7-1200" and "S7_1200".
#   models   specific model designations that belong to this family. A device
#            reporting one of these resolves to the family.
#
# Adding a family is a small, self contained pull request. Please add a case to
# product_test.go alongside it.

version: 1

families:
